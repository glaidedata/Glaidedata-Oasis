[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[parsing, infrastructure]==1.4.1",
  "pdi-nomad-plugin-rheed @ git+https://github.com/glaidedata/pdi-nomad-plugin-rheed.git@v0.2.0",
]


[project.urls]
repository = "https://github.com/glaidedata/glaidedata-oasis"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
  "nomad-baseclasses @ git+https://github.com/nomad-hzb/nomad-baseclasses.git",
  "nomad-hysprint @ git+https://github.com/nomad-hzb/nomad-hysprint.git",
  "nomad-north-voila @ git+https://github.com/FAIRmat-NFDI/nomad-north-voila.git",
  "nomad-gui==2.0.0a2.dev583"
]
jupyter = [
  "jupyter-events",
  "voila",
  "ipyaggrid",
  "ipyvuetify",
  "ipysheet",
  "ipydatagrid",
  "jupyter-flex",
  "ipympl",
  "seaborn",
  "jupyterlab>4.0"
]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[parsing, infrastructure, dev]==1.4.1"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "explicit"
# https://github.com/gmr/flatdict/issues/60
# extra-build-dependencies = { flatdict = ["setuptools<82.0.0"] }

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]

