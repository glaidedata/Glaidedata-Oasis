[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[parsing, infrastructure]==1.4.3",
]


[project.urls]
repository = "https://github.com/glaidedata/glaidedata-oasis"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
  "pdi-nomad-plugin-rheed @ git+https://github.com/glaidedata/pdi-nomad-plugin-rheed.git@v0.2.0",
  "nomad-gui==2.0.0b1",
]
jupyter = [
'jupyter-events'
]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[parsing, infrastructure, dev]==1.4.3"]

[tool.uv]
index = [
  { name = "nomad-lab", url = "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple" },
]

extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "if-necessary-or-explicit"

[tool.uv.sources]
nomad-gui = { index = "nomad-lab" }

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
