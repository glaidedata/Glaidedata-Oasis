name: Deploy oasis image to VM

on:
  workflow_call:
    inputs:
      mode:
        description: "What to deploy"
        required: false
        default: auto
        type: string
      tag:
        description: "Optional tag when mode=tag (for example: v1.2.3)"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target (netcup is manual-only during migration)"
        required: true
        default: hetzner
        type: choice
        options:
          - hetzner
          - netcup
      mode:
        description: "What to deploy"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - main
          - tag
      tag:
        description: "Optional tag when mode=tag (for example: v1.2.3)"
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-oasis-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Resolve image + deploy to VM
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.target == 'netcup' && 45 || 15 }}
    environment:
      name: ${{ inputs.target == 'netcup' && 'glaidedata-oasis-netcup-staging' || 'glaidedata-oasis-prod' }}
    env:
      INPUT_TARGET: ${{ inputs.target || 'hetzner' }}
      PACKAGE_NAME: ${{ github.event.repository.name }}
      INPUT_MODE: ${{ inputs.mode || 'auto' }}
      INPUT_TAG: ${{ inputs.tag || '' }}

    steps:
      - name: Resolve deploy ref
        id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            if (process.env.INPUT_TARGET === 'netcup') {
              if (context.eventName !== 'workflow_dispatch' ||
                  process.env.INPUT_MODE !== 'tag' ||
                  !/^v\d+\.\d+\.\d+$/.test(process.env.INPUT_TAG)) {
                throw new Error('Netcup requires a manual dispatch with mode=tag and an explicit vX.Y.Z release.');
              }
              const tag = process.env.INPUT_TAG;
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag
              });
              if (release.draft || release.tag_name !== tag) {
                throw new Error('The requested release must be published.');
              }
              core.setOutput('deploy_ref', tag);
              core.setOutput('reason', 'manual-netcup-release');
              return;
            }
            if (process.env.INPUT_TARGET !== 'hetzner') {
              throw new Error('Unsupported deployment target.');
            }

            const owner = context.repo.owner;
            const ownerType = context.payload.repository.owner.type;
            const packageName = process.env.PACKAGE_NAME.toLowerCase();
            const mode = (process.env.INPUT_MODE || "auto").trim();
            const requestedTag = (process.env.INPUT_TAG || "").trim();
            const semverTag = /^v\d+\.\d+\.\d+$/;

            const endpoint = ownerType === "Organization"
              ? "GET /orgs/{org}/packages/container/{package_name}/versions"
              : "GET /users/{username}/packages/container/{package_name}/versions";
            const params = ownerType === "Organization"
              ? { org: owner, package_name: packageName, per_page: 100 }
              : { username: owner, package_name: packageName, per_page: 100 };

            const versions = await github.paginate(endpoint, params);
            if (!versions.length) {
              core.setFailed(`No GHCR versions found for package ${owner}/${packageName}.`);
              return;
            }

            function getTags(version) {
              return version.metadata?.container?.tags || [];
            }

            const sorted = [...versions].sort(
              (a, b) => new Date(b.updated_at) - new Date(a.updated_at)
            );

            const newestMain = sorted.find((v) => getTags(v).includes("main"));
            const newestTagged = sorted.find((v) => getTags(v).some((t) => semverTag.test(t)));

            function firstSemverTag(version) {
              if (!version) return null;
              return getTags(version).find((t) => semverTag.test(t)) || null;
            }

            let selectedRef = null;
            let reason = null;

            if (mode === "main") {
              if (!newestMain) {
                core.setFailed("Requested mode=main, but no image tagged 'main' exists.");
                return;
              }
              selectedRef = "main";
              reason = "forced-main";
            } else if (mode === "tag") {
              if (requestedTag) {
                const matched = sorted.find((v) => getTags(v).includes(requestedTag));
                if (!matched) {
                  core.setFailed(`Requested tag '${requestedTag}' was not found in GHCR package ${owner}/${packageName}.`);
                  return;
                }
                selectedRef = requestedTag;
                reason = "forced-specific-tag";
              } else {
                const latestTag = firstSemverTag(newestTagged);
                if (!latestTag) {
                  core.setFailed("Requested mode=tag, but no semver tags like vX.Y.Z were found.");
                  return;
                }
                selectedRef = latestTag;
                reason = "forced-latest-tag";
              }
            } else {
              if (newestMain && newestTagged) {
                const mainTime = new Date(newestMain.updated_at).getTime();
                const tagTime = new Date(newestTagged.updated_at).getTime();
                if (mainTime >= tagTime) {
                  selectedRef = "main";
                  reason = "auto-newer-main";
                } else {
                  selectedRef = firstSemverTag(newestTagged);
                  reason = "auto-newer-tag";
                }
              } else if (newestMain) {
                selectedRef = "main";
                reason = "auto-only-main-present";
              } else if (newestTagged) {
                selectedRef = firstSemverTag(newestTagged);
                reason = "auto-only-tag-present";
              } else {
                core.setFailed("No deployable ref found: neither 'main' nor semver tags exist.");
                return;
              }
            }

            if (!selectedRef) {
              core.setFailed("Failed to resolve a deploy ref.");
              return;
            }

            core.info(`Resolved deploy ref: ${selectedRef} (${reason})`);
            core.setOutput("deploy_ref", selectedRef);
            core.setOutput("reason", reason);

      - name: Write SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          NETCUP_KNOWN_HOSTS: ${{ secrets.NETCUP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ "$INPUT_TARGET" == netcup ]]; then
            test "$DEPLOY_HOST" = 159.195.131.244
            test -n "$NETCUP_KNOWN_HOSTS"
            printf '%s\n' "$NETCUP_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi

      - name: Deploy (forced-command SSH key)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_REF: ${{ steps.resolve.outputs.deploy_ref }}
          DEPLOY_REASON: ${{ steps.resolve.outputs.reason }}
        run: |
          set -euo pipefail
          echo "Deploying ref: $DEPLOY_REF ($DEPLOY_REASON)"
          host_check=(-o StrictHostKeyChecking=accept-new)
          if [[ "$INPUT_TARGET" == netcup ]]; then
            [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
            host_check=(-o BatchMode=yes -o StrictHostKeyChecking=yes
                        -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
          fi
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              "${host_check[@]}" \
              -p 22 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "$DEPLOY_REF"
