services:
  api_host: "localhost"
  api_base_path: "/nomad-oasis"
  upload_limit: 1000
  upload_members_group_search_enabled: true

oasis:
  is_oasis: true
  uses_central_user_management: true
  allowed_users:
        - joseph.rudzinski@physik.hu-berlin.de
        - sebastian.brueckner@physik.hu-berlin.de
        - abbas.gholami@glaidedata.com
        - bierwagen@pdi-berlin.de
        - hoffmann@pdi-berlin.de

north:
  jupyterhub_crypt_key: "978bfb2e13a8448a253c629d8dd84ff89587f30e635b753153960930cad9d36d"
  tools:
    options:
      jupyter:
        image: ghcr.io/glaidedata/glaidedata-oasis/jupyter:main

# Registering HySprint and Voila plugins
plugins:
  entry_points:
    include:
      - "nomad_hysprint.apps:hysprint_voila_app"
      - "nomad_hysprint.schema_packages:hysprint_package"
      - "nomad_north_voila.north_tools:voila"
      
meta:
  deployment: "oasis"
  deployment_url: "https://my-oasis.org/api"
  maintainer_email: "me@my-oasis.org"

logstash:
  enabled: false

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1
